<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>オセロ</title>
    <style>
      :root {
        --piece-size: 40px;
        --button-bg-color: #ddd;
        --button-bg-color-disabled: oklch(from var(--button-bg-color) 60% c h / alpha);

        --setting-color: #222;
        --setting-color-disabeld: oklch(from var(--setting-color) 60% c h / alpha);
      }

      td {
        width: 60px;
        height: 60px;
        background-color: rgb(139, 221, 139);
        background-color: oklch(80.735% 0.14838 142.189);
        position: relative;
        cursor: pointer;
      }

      .othello__piece {
        position: absolute;
        display: block;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        width: var(--piece-size);
        height: var(--piece-size);
        border-radius: 100vmax;
      }

      .othello__piece.empty {
        background-color: transparent;
      }

      .othello__piece.black {
        background-color: #333;
      }

      .othello__piece.white {
        background-color: #fff;
      }

      button {
        /* ブラウザのデフォルトのスタイルをリセット */
        padding: 0;
        border: none;
        outline: none;
        font: inherit;
        color: inherit;
        background: none;
      }

      button {
        padding: 1em 1.5em;
        background-color: var(--button-bg-color);

        &[disabled] {
          background-color: var(--button-bg-color-disabled);
        }
      }

      .setting-container {
        display: block flex;
      }

      .setting {
        padding-right: 1rem;
      }

      .setting[disabled] {
        color: var(--setting-color-disabeld);
      }

      .radio-button-container {
        display: block flex;
        flex-direction: column;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <table id="board-table"></table>
    <p id="turn-text">ターン: 1 | プレイヤー: 黒</p>
    <button type="button" id="restart-button">リスタート</button>
    <button type="button" id="undo-button" disabled>一手もどる</button>
    <button type="button" id="redo-button" disabled>一手すすむ</button>

    <div class="setting-container">
      <fieldset class="setting setting__mode-select">
        <legend>対戦モードの選択 (Botの強さ):</legend>
        <div class="radio-button-container">
          <div>
            <input type="radio" id="mode-human" name="bot-mode" value="human" checked />
            <label for="mode-human">対人戦 (Botなし)</label>
          </div>

          <div>
            <input type="radio" id="mode-random" name="bot-mode" value="random" />
            <label for="mode-random">ランダム (Easy)</label>
          </div>
          <div>
            <input type="radio" id="mode-greedy" name="bot-mode" value="greedy" />
            <label for="mode-greedy">強欲 (Normal)</label>
          </div>
          <div>
            <input type="radio" id="mode-corner" name="bot-mode" value="focusOnCorner" />
            <label for="mode-corner">角重視 (Hard)</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="setting setting__player-piece" id="player-piece-select" disabled>
        <legend>プレイヤーの持ち駒を選択:</legend>
        <div class="radio-button-container">
          <div>
            <input type="radio" id="piece-black" name="player-piece" value="black" checked />
            <label for="piece-black">先手 (黒)</label>
          </div>

          <div>
            <input type="radio" id="piece-white" name="player-piece" value="white" />
            <label for="piece-white">後手 (白)</label>
          </div>
        </div>
      </fieldset>
    </div>
  </body>
</html>
